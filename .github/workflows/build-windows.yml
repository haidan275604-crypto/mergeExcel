name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:      # 允许在网页上手动点按钮触发

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --noconsole --name ExcelMergeTool --hidden-import openpyxl excel_merge_gui.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExcelMergeTool-Windows
          path: dist/ExcelMergeTool.exe
          retention-days: 30
